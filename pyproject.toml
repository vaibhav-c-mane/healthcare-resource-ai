[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hcalloc"
version = "2.0.0"
description = "Forecast-then-allocate system for hospital beds across a network of hospitals, plus the v1 single-hospital beds, nurses and equipment planner"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "tabulate>=0.9",
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
dashboard = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
hcalloc = "hcalloc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hcalloc.network" = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
